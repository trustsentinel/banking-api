<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>banking-api</title>
<style>
:root{--bg:#fbfcfd;--fg:#1a2230;--muted:#5d6b7a;--line:#e1e7ec;--accent:#0b6e67;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--fg:#e3e9ee;--muted:#95a3b2;--line:#263240;--accent:#3fc1b4;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:40rem;margin-inline:auto;padding:4rem 1.25rem}
h1{font-size:1.8rem;margin:0 0 .5rem}
p{color:var(--muted)}
ul{list-style:none;padding:0;margin:2rem 0 0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a{color:var(--accent);text-decoration:none;display:block;padding:.9rem .2rem}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>banking-api</h1>
  <p>A private, single-user tool that reads its operator's own payment accounts through a
  regulated account information service provider, in order to reconcile pending payment
  notices against actual charges. Read-only: it cannot move money.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Service</a></li>
  </ul>
</main>
</body>
</html>
